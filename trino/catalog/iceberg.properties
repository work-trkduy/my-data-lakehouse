# Trino catalog connecting to Apache Polaris (Iceberg REST) over MinIO.
# ${ENV:...} is expanded by Trino from container environment variables.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:CLIENT_ID}:${ENV:CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.warehouse=quickstart_catalog
iceberg.rest-catalog.vended-credentials-enabled=false
# Trino-native S3 file system (used by the Iceberg catalog).
fs.s3.enabled=true
# Static MinIO S3 credentials (avoid Polaris read-delegation grants the root
# service_admin role does not have by default).
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
s3.endpoint=${ENV:MINIO_ENDPOINT}
s3.path-style-access=true
s3.region=us-west-2
# Route requests to the correct Polaris realm
iceberg.rest-catalog.http-headers=Polaris-Realm: POLARIS